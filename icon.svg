<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#44a39d"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Seed/sprout body -->
  <ellipse cx="256" cy="340" rx="80" ry="40" fill="#8b6f47" opacity="0.3"/>
  <!-- Stem -->
  <path d="M256 340 Q256 260 256 200" stroke="#5d9c3f" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Left leaf -->
  <path d="M256 280 Q180 240 160 180 Q220 200 256 260 Z" fill="url(#leaf)"/>
  <!-- Right leaf -->
  <path d="M256 260 Q330 200 360 150 Q300 220 256 280 Z" fill="url(#leaf)" opacity="0.85"/>
  <!-- Top sprout -->
  <path d="M256 200 Q230 170 240 130 Q260 160 256 200 Z" fill="#6cc24a"/>
  <path d="M256 200 Q282 170 272 130 Q252 160 256 200 Z" fill="#6cc24a" opacity="0.85"/>
  <!-- Checkmark circle -->
  <circle cx="256" cy="200" r="50" fill="none" stroke="#ffe66d" stroke-width="6" opacity="0.6"/>
  <!-- Sparkle -->
  <circle cx="380" cy="120" r="6" fill="#ffe66d" opacity="0.8"/>
  <circle cx="130" cy="150" r="4" fill="#ffe66d" opacity="0.6"/>
</svg>
