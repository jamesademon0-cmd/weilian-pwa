<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>微练 — 微习惯 × 刻意练习</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="微练">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
/* ========== CSS Variables ========== */
:root {
  --primary: #667eea;
  --primary-dark: #5568d3;
  --primary-light: #818cf8;
  --accent: #f093fb;
  --success: #4ecdc4;
  --warning: #ffe66d;
  --danger: #ff6b6b;
  --bg: #f0f2f8;
  --card: #ffffff;
  --text: #2d3436;
  --text-light: #636e72;
  --text-muted: #b2bec3;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --nav-h: 64px;
  --header-h: 56px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}

/* ========== App Container ========== */
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  background: var(--bg);
}

/* ========== Header ========== */
.app-header {
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-header h1 { font-size: 20px; font-weight: 700; }
.level-badge {
  background: rgba(255,255,255,0.25);
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  backdrop-filter: blur(4px);
}

/* ========== Main Content ========== */
#view-container {
  padding: 16px 16px calc(var(--nav-h) + 24px);
  min-height: calc(100vh - var(--header-h));
}

/* ========== Bottom Navigation ========== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  max-width: 480px;
  margin: 0 auto;
  height: var(--nav-h);
  background: #fff;
  display: flex;
  box-shadow: 0 -2px 20px rgba(0,0,0,0.06);
  z-index: 100;
}
.nav-btn {
  flex: 1;
  border: none;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--text-muted);
  cursor: pointer;
  transition: color .2s;
  font-size: 11px;
}
.nav-btn .nav-icon { font-size: 22px; transition: transform .2s; }
.nav-btn.active { color: var(--primary); font-weight: 600; }
.nav-btn.active .nav-icon { transform: translateY(-2px) scale(1.15); }

/* ========== Cards ========== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ========== Greeting ========== */
.greeting {
  background: linear-gradient(135deg, var(--primary), #764ba2);
  border-radius: var(--radius);
  padding: 24px 20px;
  color: #fff;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.greeting::after {
  content: '';
  position: absolute;
  top: -20px; right: -20px;
  width: 100px; height: 100px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.greeting h2 { font-size: 22px; margin-bottom: 6px; }
.greeting p { font-size: 13px; opacity: 0.9; }
.greeting .char-emoji { font-size: 48px; position: absolute; right: 20px; bottom: 16px; }

/* ========== XP Bar ========== */
.xp-bar-wrap { margin-top: 14px; }
.xp-bar-label { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.9; margin-bottom: 6px; }
.xp-bar { height: 8px; background: rgba(255,255,255,0.25); border-radius: 4px; overflow: hidden; }
.xp-bar-fill { height: 100%; background: #fff; border-radius: 4px; transition: width .5s ease; }

/* ========== Quick Stats ========== */
.stats-row { display: flex; gap: 12px; }
.stat-box {
  flex: 1;
  text-align: center;
  padding: 14px 8px;
}
.stat-box .stat-val { font-size: 26px; font-weight: 800; color: var(--primary); }
.stat-box .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* ========== Habit Item ========== */
.habit-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: #fff;
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  transition: transform .15s;
}
.habit-item:active { transform: scale(0.98); }
.habit-check {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2.5px solid var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: all .25s;
  font-size: 22px;
  background: #fff;
}
.habit-check.done {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
  transform: scale(1.05);
}
.habit-info { flex: 1; min-width: 0; }
.habit-name { font-size: 15px; font-weight: 600; }
.habit-target { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.habit-streak {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 13px;
  font-weight: 700;
  color: var(--warning);
  flex-shrink: 0;
}
.habit-streak .fire { font-size: 16px; }

/* ========== Buttons ========== */
.btn {
  border: none;
  border-radius: var(--radius-sm);
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
}
.btn-primary:active { transform: scale(0.97); }
.btn-outline {
  background: transparent;
  border: 2px solid var(--primary);
  color: var(--primary);
}
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 8px 16px; font-size: 13px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ========== FAB ========== */
.fab {
  position: fixed;
  bottom: calc(var(--nav-h) + 16px);
  right: 20px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  color: #fff;
  border: none;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(102,126,234,0.5);
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .2s;
}
.fab:active { transform: scale(0.9) rotate(90deg); }

/* ========== Modal ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn .2s;
}
.modal-overlay.show { display: flex; }
.modal-content {
  background: #fff;
  width: 100%;
  max-width: 480px;
  border-radius: 24px 24px 0 0;
  padding: 24px 20px 32px;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp .3s;
}
.modal-handle {
  width: 40px; height: 4px;
  background: #ddd;
  border-radius: 2px;
  margin: 0 auto 20px;
}
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; text-align: center; }

/* ========== Form ========== */
.form-group { margin-bottom: 18px; }
.form-label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.form-label .hint { font-size: 12px; color: var(--text-muted); font-weight: 400; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid #e0e0e0;
  border-radius: var(--radius-sm);
  font-size: 15px;
  transition: border-color .2s;
  background: #fff;
  color: var(--text);
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--primary);
}
.form-textarea { resize: vertical; min-height: 80px; }

/* ========== Skill Item ========== */
.skill-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}
.skill-header { display: flex; align-items: center; justify-content: space-between; }
.skill-name { font-size: 17px; font-weight: 700; }
.skill-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.subskill-list { margin-top: 14px; }
.subskill-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-top: 1px solid #f0f0f0;
}
.subskill-level {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.comfort-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.comfort-comfort { background: #e8f5e9; color: #4caf50; }
.comfort-edge { background: #fff3e0; color: #ff9800; }
.comfort-beyond { background: #ffebee; color: #f44336; }

/* ========== Practice Session ========== */
.practice-log {
  background: #f8f9ff;
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 10px;
  border-left: 3px solid var(--primary);
}
.practice-log .pl-focus { font-weight: 600; font-size: 14px; }
.practice-log .pl-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.rating-stars { font-size: 16px; letter-spacing: 2px; }

/* ========== Achievement ========== */
.achievement-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.achievement {
  text-align: center;
  padding: 14px 8px;
  border-radius: var(--radius-sm);
  background: #f5f5f5;
  opacity: 0.4;
  transition: all .3s;
}
.achievement.unlocked {
  opacity: 1;
  background: linear-gradient(135deg, #fff9e6, #fff3cd);
  box-shadow: 0 2px 12px rgba(255,230,109,0.4);
}
.achievement .ach-icon { font-size: 32px; margin-bottom: 6px; }
.achievement .ach-name { font-size: 11px; font-weight: 600; }
.achievement .ach-desc { font-size: 9px; color: var(--text-muted); margin-top: 2px; }

/* ========== Character Growth ========== */
.character-display {
  text-align: center;
  padding: 30px 20px;
  background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
  border-radius: var(--radius);
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.character-emoji { font-size: 72px; margin-bottom: 8px; animation: bounce 2s infinite; }
.character-stage { font-size: 18px; font-weight: 700; color: #2e7d32; }
.character-hint { font-size: 12px; color: #4caf50; margin-top: 4px; }

/* ========== Resistance Check ========== */
.resistance-check {
  background: #fff8e1;
  border: 2px dashed var(--warning);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin: 12px 0;
  text-align: center;
}
.resistance-check p { font-size: 13px; color: var(--text-light); }

/* ========== Progress Ring ========== */
.progress-ring-wrap { display: flex; justify-content: center; margin: 8px 0; }
.progress-ring {
  width: 80px; height: 80px;
  position: relative;
}
.progress-ring svg { transform: rotate(-90deg); }
.progress-ring .ring-bg { stroke: #e0e0e0; }
.progress-ring .ring-fill { stroke: var(--primary); transition: stroke-dashoffset .5s; }
.progress-ring .ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  text-align: center;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
}

/* ========== Weekly Chart ========== */
.weekly-chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bar { width: 100%; border-radius: 4px 4px 0 0; background: var(--primary); min-height: 4px; transition: height .5s; }
.bar.today { background: var(--accent); }
.bar-label { font-size: 10px; color: var(--text-muted); }

/* ========== Toast ========== */
#toast {
  position: fixed;
  top: 70px; left: 50%;
  transform: translateX(-50%);
  background: rgba(45,52,54,0.95);
  color: #fff;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14px;
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s, transform .3s;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast .toast-emoji { font-size: 18px; margin-right: 6px; }

/* ========== Empty State ========== */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* ========== Principle Card ========== */
.principle-card {
  background: linear-gradient(135deg, #f0f4ff, #e8ecff);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 14px;
  border-left: 3px solid var(--primary);
}
.principle-card .principle-tag {
  display: inline-block;
  font-size: 10px;
  background: var(--primary);
  color: #fff;
  padding: 2px 8px;
  border-radius: 8px;
  margin-bottom: 6px;
}
.principle-card p { font-size: 13px; color: var(--text-light); }

/* ========== Animations ========== */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes popIn { 0% { transform: scale(0); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.anim-pop { animation: popIn .35s ease; }
.anim-shake { animation: shake .3s; }

/* ========== Misc ========== */
.divider { height: 1px; background: #f0f0f0; margin: 14px 0; }
.text-center { text-align: center; }
.mt-12 { margin-top: 12px; }
.mt-20 { margin-top: 20px; }
.mb-12 { margin-bottom: 12px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.tag {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 8px;
  font-weight: 600;
}
.tag-primary { background: #eef0ff; color: var(--primary); }
.tag-success { background: #e8f5e9; color: #4caf50; }
.tag-warning { background: #fff8e1; color: #ffa000; }
.hidden { display: none !important; }
.section-label { font-size: 13px; font-weight: 700; color: var(--text-light); margin: 20px 0 10px 4px; }
</style>
</head>
<body>

<div id="app">
  <header class="app-header">
    <h1 id="page-title">微练</h1>
    <div class="level-badge" id="header-level">Lv 1</div>
  </header>

  <main id="view-container"></main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="home" onclick="navigate('home')">
      <span class="nav-icon">🏠</span>首页
    </button>
    <button class="nav-btn" data-view="habits" onclick="navigate('habits')">
      <span class="nav-icon">🌱</span>微习惯
    </button>
    <button class="nav-btn" data-view="practice" onclick="navigate('practice')">
      <span class="nav-icon">🎯</span>刻意练习
    </button>
    <button class="nav-btn" data-view="growth" onclick="navigate('growth')">
      <span class="nav-icon">🌳</span>成长
    </button>
  </nav>

  <button class="fab" id="fab" onclick="onFabClick()">+</button>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-content" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
 * 微练 App — 核心逻辑
 * 基于《微习惯》《刻意练习》原理设计
 * ========================================================= */

// ========== State ==========
let state = {
  user: { name: '探索者', level: 1, totalXP: 0, joinDate: todayStr() },
  microHabits: [],
  skills: [],
  practiceSessions: [],
  achievements: [],
  currentView: 'home'
};

// ========== Constants ==========
const CHARACTER_STAGES = [
  { minLevel: 0, emoji: '🌰', name: '种子', hint: '每一段旅程都始于一颗种子' },
  { minLevel: 6, emoji: '🌱', name: '嫩芽', hint: '破土而出，迎接阳光' },
  { minLevel: 16, emoji: '🌿', name: '幼苗', hint: '根扎得越来越深' },
  { minLevel: 31, emoji: '🌳', name: '小树', hint: '风雨中依然挺立' },
  { minLevel: 51, emoji: '🌲', name: '参天大树', hint: '为他人遮荫，向上生长' }
];

const ACHIEVEMENT_DEFS = [
  { id: 'first_habit', icon: '🌱', name: '初心者', desc: '完成第一次微习惯打卡', check: s => s.microHabits.some(h => h.history.length > 0) },
  { id: 'streak_7', icon: '🔥', name: '七日不灭', desc: '连续7天完成微习惯', check: s => s.microHabits.some(h => h.bestStreak >= 7) },
  { id: 'streak_30', icon: '🌟', name: '三十日心', desc: '连续30天完成微习惯', check: s => s.microHabits.some(h => h.bestStreak >= 30) },
  { id: 'streak_100', icon: '💯', name: '百日筑基', desc: '连续100天完成微习惯', check: s => s.microHabits.some(h => h.bestStreak >= 100) },
  { id: 'first_practice', icon: '🎯', name: '突破者', desc: '完成第一次刻意练习', check: s => s.practiceSessions.length >= 1 },
  { id: 'practice_10', icon: '⏱️', name: '专注达人', desc: '累计练习满10小时', check: s => s.practiceSessions.reduce((a,p) => a + p.duration, 0) >= 600 },
  { id: 'subskill_5', icon: '🧠', name: '心理表征', desc: '创建5个子技能', check: s => s.skills.reduce((a,sk) => a + sk.subSkills.length, 0) >= 5 },
  { id: 'breakthrough_5', icon: '⚡', name: '舒适区外', desc: '标记5次突破舒适区', check: s => s.practiceSessions.filter(p => p.breakthrough).length >= 5 },
  { id: 'habit_master', icon: '🌳', name: '生生不息', desc: '累计完成100次微习惯', check: s => s.microHabits.reduce((a,h) => a + h.history.length, 0) >= 100 },
  { id: 'level_10', icon: '🏆', name: '初露锋芒', desc: '等级达到10级', check: s => s.user.level >= 10 },
  { id: 'level_30', icon: '👑', name: '渐入佳境', desc: '等级达到30级', check: s => s.user.level >= 30 },
  { id: 'level_50', icon: '💎', name: '精通之路', desc: '等级达到50级', check: s => s.user.level >= 50 }
];

const HABIT_SUGGESTIONS = [
  { name: '每天1个俯卧撑', minTarget: 1, unit: '个', icon: '💪' },
  { name: '每天读1页书', minTarget: 1, unit: '页', icon: '📖' },
  { name: '每天冥想1分钟', minTarget: 1, unit: '分钟', icon: '🧘' },
  { name: '每天写50字日记', minTarget: 50, unit: '字', icon: '✍️' },
  { name: '每天背1个单词', minTarget: 1, unit: '个', icon: '🔤' },
  { name: '每天喝1杯水', minTarget: 1, unit: '杯', icon: '💧' },
  { name: '每天拉伸1分钟', minTarget: 1, unit: '分钟', icon: '🤸' },
  { name: '每天走路5分钟', minTarget: 5, unit: '分钟', icon: '🚶' }
];

// ========== Persistence ==========
function saveState() {
  try { localStorage.setItem('weilian_state', JSON.stringify(state)); } catch(e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem('weilian_state');
    if (raw) {
      const loaded = JSON.parse(raw);
      Object.assign(state, loaded);
    }
  } catch(e) {}
}

// ========== Helpers ==========
function todayStr() { return new Date().toISOString().slice(0,10); }
function uuid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function formatDate(d) {
  const dt = new Date(d);
  return `${dt.getMonth()+1}月${dt.getDate()}日`;
}
function formatDuration(min) {
  if (min < 60) return `${min}分钟`;
  const h = Math.floor(min/60), m = min%60;
  return m ? `${h}时${m}分` : `${h}小时`;
}
function daysBetween(d1, d2) {
  return Math.round((new Date(d2) - new Date(d1)) / 86400000);
}
function getLevelFromXP(xp) {
  // 每级需要的XP递增: 100, 150, 200, 250...
  let level = 1, need = 100, acc = 0;
  while (xp >= acc + need) { acc += need; level++; need += 50; }
  return { level, current: xp - acc, need, progress: (xp - acc) / need };
}
function xpForLevel(level) {
  let xp = 0, need = 100;
  for (let i = 1; i < level; i++) { xp += need; need += 50; }
  return xp;
}
function getCharacterStage(level) {
  let stage = CHARACTER_STAGES[0];
  for (const s of CHARACTER_STAGES) {
    if (level >= s.minLevel) stage = s;
  }
  return stage;
}

// ========== Toast ==========
function showToast(msg, emoji='') {
  const el = document.getElementById('toast');
  el.innerHTML = emoji ? `<span class="toast-emoji">${emoji}</span>${msg}` : msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

// ========== Modal ==========
function openModal(html) {
  document.getElementById('modal-content').innerHTML =
    `<div class="modal-handle"></div>${html}`;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('show');
}

// ========== XP & Level ==========
function addXP(amount, reason) {
  state.user.totalXP += amount;
  const before = getLevelFromXP(state.user.totalXP - amount);
  const after = getLevelFromXP(state.user.totalXP);
  state.user.level = after.level;
  if (after.level > before.level) {
    showToast(`升级到 Lv${after.level}！`, '🎉');
  }
  saveState();
  checkAchievements();
}

// ========== Achievements ==========
function checkAchievements() {
  for (const def of ACHIEVEMENT_DEFS) {
    const exists = state.achievements.find(a => a.id === def.id);
    if (!exists && def.check(state)) {
      state.achievements.push({ id: def.id, unlocked: true, date: todayStr() });
      showToast(`解锁成就: ${def.name}`, def.icon);
      addXP(50, 'achievement');
    }
  }
  saveState();
}

// ========== Navigation ==========
function navigate(view) {
  state.currentView = view;
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  const titles = { home:'微练', habits:'微习惯', practice:'刻意练习', growth:'成长' };
  document.getElementById('page-title').textContent = titles[view];
  const fab = document.getElementById('fab');
  fab.style.display = (view === 'home' || view === 'growth') ? 'none' : 'flex';
  renderView();
}

function renderView() {
  const container = document.getElementById('view-container');
  switch(state.currentView) {
    case 'home': container.innerHTML = renderHome(); break;
    case 'habits': container.innerHTML = renderHabits(); break;
    case 'practice': container.innerHTML = renderPractice(); break;
    case 'growth': container.innerHTML = renderGrowth(); break;
  }
  updateHeaderLevel();
}

function updateHeaderLevel() {
  const lv = getLevelFromXP(state.user.totalXP);
  document.getElementById('header-level').textContent = `Lv ${lv.level}`;
}

function addHabit() {
  const name = document.getElementById('habit-name').value.trim();
  const target = parseInt(document.getElementById('habit-target').value) || 1;
  const unit = document.getElementById('habit-unit').value.trim() || '次';

  closeModal();

  addXP(10, 'new_habit');
  renderView();
}

function toggleHabit(id) {
  const h = state.microHabits.find(x => x.id === id);
  if (!h) return;
  const today = todayStr();
  const idx = h.history.findIndex(r => r.date === today);
  if (idx >= 0) {
    h.history.splice(idx, 1);
    h.streak = calcStreak(h);
    showToast('已取消今日打卡', '↩️');
  } else {
    h.history.push({ date: today, completed: true });
    h.streak = calcStreak(h);
    if (h.streak > (h.bestStreak || 0)) h.bestStreak = h.streak;
    const msg = h.streak > 1 ? `连续${h.streak}天！` : '完成！';
    showToast(msg, '🎉');
    addXP(10, 'habit');
  }
  saveState();
  checkAchievements();
  renderView();
}

function calcStreak(habit) {
  if (!habit.history.length) return 0;
  const dates = habit.history.map(r => r.date).sort();
  let streak = 0;
  let d = new Date();
  // Check today first
  const today = todayStr();
  const hasToday = dates.includes(today);
  if (!hasToday) {
    // Check yesterday (streak can continue if today not yet done but was done yesterday)
    d.setDate(d.getDate() - 1);
  }
  while (true) {
    const ds = d.toISOString().slice(0,10);
    if (dates.includes(ds)) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

      <label class="form-label">技能图标</label>

        ${['🎯','🎹','💻','🎨','⚽','📚','✍️','🎤','🎸','🏃'].map(e =>
          `<button class="btn btn-outline btn-sm" id="skill-icon-${e}" onclick="selectSkillIcon('${e}')">${e}</button>`
        ).join('')}
      </div>
      <input type="hidden" id="skill-icon" value="🎯">
    </div>
    <div class="principle-card">
      <span class="principle-tag">刻意练习</span>
      <p>🧠 创建技能后，请将其<b>拆解</b>为具体可练习的子技能。这是刻意练习的第一步。</p>
    </div>
    <button class="btn btn-primary btn-block" onclick="addSkill()">创建技能</button>
  `);
}

function selectSkillIcon(e) {
  document.getElementById('skill-icon').value = e;
  document.querySelectorAll('[id^="skill-icon-"]').forEach(b => {
    b.style.background = '';
    b.style.color = '';
  });
  const btn = document.getElementById(`skill-icon-${e}`);
  btn.style.background = 'var(--primary)';
  btn.style.color = '#fff';
}

function addSkill() {
  const name = document.getElementById('skill-name').value.trim();
  const icon = document.getElementById('skill-icon').value;
  if (!name) { showToast('请输入技能名称'); return; }
  const skill = { id: uuid(), name, icon, subSkills: [], createdAt: todayStr() };
  state.skills.push(skill);
  saveState();
  closeModal();
  showToast('技能已创建，请添加子技能拆解', '🎯');
  addXP(20, 'new_skill');
  renderView();
}

function showAddSubSkillModal(skillId) {
  openModal(`
    <div class="modal-title">添加子技能</div>
    <div class="principle-card">
      <span class="principle-tag">心理表征</span>
      <p>🧠 把复杂技能拆解成可单独练习的部分。例如：钢琴 → 左手伴奏、右手旋律、双手协调。</p>
    </div>
    <div class="form-group">
      <label class="form-label">子技能名称</label>
      <input type="text" class="form-input" id="subskill-name" placeholder="如：左手伴奏节奏" maxlength="20">
    </div>
    <div class="form-group">
      <label class="form-label">当前水平 (1-10)</label>
      <input type="number" class="form-input" id="subskill-level" value="1" min="1" max="10">
    </div>
    <div class="form-group">
      <label class="form-label">舒适区位置</label>
      <select class="form-select" id="subskill-comfort">
        <option value="comfort">舒适区 — 已经掌握，重复即可</option>
        <option value="edge" selected>舒适区边缘 — 略有挑战</option>
        <option value="beyond">舒适区外 — 很有挑战</option>
      </select>
    </div>
    <button class="btn btn-primary btn-block" onclick="addSubSkill('${skillId}')">添加</button>
  `);
}

function addSubSkill(skillId) {
  const name = document.getElementById('subskill-name').value.trim();
  const level = parseInt(document.getElementById('subskill-level').value) || 1;
  const comfort = document.getElementById('subskill-comfort').value;
  if (!name) { showToast('请输入子技能名称'); return; }
  const skill = state.skills.find(s => s.id === skillId);
  skill.subSkills.push({ id: uuid(), name, level, comfort });
  saveState();
  closeModal();
  showToast('子技能已添加', '🧠');
  addXP(15, 'subskill');
  checkAchievements();
  renderView();
}

function showPracticeModal(skillId) {
  const skill = state.skills.find(s => s.id === skillId);
  const subOptions = skill.subSkills.length
    ? skill.subSkills.map(ss => `<option value="${ss.id}">${ss.name} (Lv${ss.level})</option>`).join('')
    : `<option value="">（无子技能）</option>`;

  openModal(`
    <div class="modal-title">开始刻意练习 · ${skill.name}</div>
    <div class="principle-card">
      <span class="principle-tag">专注</span>
      <p>🎯 设定一个<b>具体</b>的练习焦点。不是"练习"，而是"把这段节奏从60bpm提到70bpm"。</p>
    </div>
    <div class="form-group">
      <label class="form-label">练习子技能</label>
      <select class="form-select" id="practice-subskill">${subOptions}</select>
    </div>
    <div class="form-group">
      <label class="form-label">本次练习焦点 <span class="hint">（越具体越好）</span></label>
      <input type="text" class="form-input" id="practice-focus" placeholder="如：把困难段落提速到80bpm" maxlength="40">
    </div>
    <div class="form-group">
      <label class="form-label">计划时长（分钟）</label>
      <input type="number" class="form-input" id="practice-duration" value="25" min="5" max="180">
    </div>
    <div class="form-group">
      <label class="form-label">舒适区评估</label>
      <select class="form-select" id="practice-comfort">
        <option value="comfort">舒适区 — 轻松完成</option>
        <option value="edge" selected>舒适区边缘 — 略有挑战</option>
        <option value="beyond">舒适区外 — 很有挑战</option>
      </select>
    </div>
    <button class="btn btn-primary btn-block" onclick="startPractice('${skillId}')">开始计时</button>
    <div id="practice-timer-area" style="display:none;margin-top:20px;">
      <div style="text-align:center;">
        <div id="timer-display" style="font-size:48px;font-weight:700;color:var(--primary);">25:00</div>
        <div style="font-size:13px;color:var(--text-muted);">专注练习中…</div>
      </div>
      <button class="btn btn-success btn-block mt-12" onclick="finishPractice('${skillId}')">完成练习</button>
    </div>
  `);
}

let practiceTimer = null;
let practiceStartTime = null;
let practicePlannedDuration = 25;

function startPractice(skillId) {
  const focus = document.getElementById('practice-focus').value.trim();
  if (!focus) { showToast('请设定练习焦点'); return; }
  practicePlannedDuration = parseInt(document.getElementById('practice-duration').value) || 25;

  document.querySelector('.modal-title').textContent = '练习中…';
  document.getElementById('practice-timer-area').style.display = 'block';
  // Hide form
  const formGroups = document.querySelectorAll('.modal-content .form-group, .modal-content .principle-card');
  formGroups.forEach(g => g.style.display = 'none');
  document.querySelector('.modal-content .btn-primary').style.display = 'none';

  practiceStartTime = Date.now();
  let remaining = practicePlannedDuration * 60;
  const display = document.getElementById('timer-display');

  practiceTimer = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(practiceTimer);
      display.textContent = '00:00';
      showToast('时间到！', '⏰');
      return;
    }
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    display.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }, 1000);
}

let pendingPractice = null;

function finishPractice(skillId) {
  if (practiceTimer) clearInterval(practiceTimer);
  const skill = state.skills.find(s => s.id === skillId);
  const subSkillId = document.getElementById('practice-subskill').value;
  const focus = document.getElementById('practice-focus').value.trim() || '练习';
  const comfort = document.getElementById('practice-comfort').value;
  const actualDuration = practiceStartTime ? Math.max(5, Math.round((Date.now() - practiceStartTime) / 60000)) : practicePlannedDuration;

  // Store for savePractice to read
  pendingPractice = { skillId, subSkillId, focus, duration: actualDuration, comfort };

  closeModal();

  // Escape for HTML display
  const focusEsc = focus.replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Show feedback modal
  openModal(`
    <div class="modal-title">练习反馈</div>
    <div class="principle-card">
      <span class="principle-tag">即时反馈</span>
      <p>📊 刻意练习的核心：每次练习后立即评估表现，找到改进方向。</p>
    </div>
    <div style="text-align:center;margin:16px 0;">
      <div style="font-size:14px;color:var(--text-muted);">练习焦点</div>
      <div style="font-size:16px;font-weight:700;margin-top:4px;">${focusEsc}</div>
      <div style="font-size:13px;color:var(--text-muted);margin-top:6px;">实际时长: ${formatDuration(actualDuration)}</div>
    </div>
    <div class="form-group">
      <label class="form-label">本次表现评分</label>
      <div style="display:flex;gap:6px;justify-content:center;" id="rating-stars">
        ${[1,2,3,4,5].map(n => `<span id="star-${n}" style="font-size:36px;cursor:pointer;color:#ddd;" onclick="selectRating(${n})">★</span>`).join('')}
      </div>
      <input type="hidden" id="practice-rating" value="3">
    </div>
    <div class="form-group">
      <label class="form-label">练习笔记 <span class="hint">（哪里做得好？哪里需要改进？）</span></label>
      <textarea class="form-textarea" id="practice-notes" placeholder="记录你的反思…"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">
        <input type="checkbox" id="practice-breakthrough" style="width:auto;margin-right:6px;">
        本次练习突破了舒适区
      </label>
    </div>
    <button class="btn btn-primary btn-block" onclick="savePractice()">保存记录</button>
  `);

  selectRating(3); // Default
}

function selectRating(n) {
  document.getElementById('practice-rating').value = n;
  for (let i = 1; i <= 5; i++) {
    const star = document.getElementById(`star-${i}`);
    if (star) {
      star.style.color = i <= n ? 'var(--warning)' : '#ddd';
    }
  }
}

function savePractice() {
  if (!pendingPractice) { closeModal(); return; }
  const { skillId, subSkillId, focus, duration, comfort } = pendingPractice;
  const rating = parseInt(document.getElementById('practice-rating').value) || 3;
  const notes = document.getElementById('practice-notes').value.trim();
  const breakthrough = document.getElementById('practice-breakthrough').checked;

  const session = {
    id: uuid(),
    skillId,
    subSkillId,
    date: todayStr(),
    duration,
    focus,
    rating,
    notes,
    comfort,
    breakthrough
  };
  state.practiceSessions.push(session);

  // Update sub-skill comfort based on session
  if (subSkillId) {
    const skill = state.skills.find(s => s.id === skillId);
    const ss = skill.subSkills.find(x => x.id === subSkillId);
    if (ss) {
      // Update comfort to match practice assessment
      ss.comfort = comfort;
      // If consistently rated high, suggest leveling up
      if (rating >= 4) {
        // Could show suggestion
      }
    }
  }

  pendingPractice = null;
  saveState();
  closeModal();
  const xp = 20 + Math.floor(duration / 10) + (breakthrough ? 15 : 0);
  addXP(xp, 'practice');
  showToast(`+${xp} XP！`, '🎯');
  checkAchievements();
  renderView();
}

function showSessionHistory(skillId) {
  const sessions = state.practiceSessions.filter(p => p.skillId === skillId).sort((a,b) => b.date.localeCompare(a.date));
  const skill = state.skills.find(s => s.id === skillId);

  let html = `<div class="modal-title">📜 ${skill.name} · 练习记录</div>`;

  if (sessions.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📭</div><p>还没有练习记录</p></div>`;
  } else {
    sessions.forEach(p => {
      const sub = skill.subSkills.find(ss => ss.id === p.subSkillId);
      html += `
        <div class="practice-log">
          <div class="pl-focus">${p.focus}</div>
          <div class="pl-meta">
            ${formatDate(p.date)} · ${formatDuration(p.duration)} ·
            <span class="rating-stars">${'★'.repeat(p.rating)}${'☆'.repeat(5-p.rating)}</span>
            ${p.breakthrough ? ' · <span class="tag tag-warning">突破</span>' : ''}
            ${sub ? ' · ' + sub.name : ''}
          </div>
          ${p.notes ? `<div style="font-size:12px;color:var(--text-light);margin-top:6px;padding:8px;background:#f5f5f5;border-radius:6px;">💭 ${p.notes}</div>` : ''}
        </div>
      `;
    });
  }

  html += `<button class="btn btn-outline btn-block mt-12" onclick="closeModal()">关闭</button>`;
  openModal(html);
}

// ===================================================
// VIEW: GROWTH
// ===================================================
function renderGrowth() {
  const lv = getLevelFromXP(state.user.totalXP);
  const char = getCharacterStage(lv.level);

  let html = `
    <div class="character-display">
      <div class="character-emoji">${char.emoji}</div>
      <div class="character-stage">${char.name}</div>
      <div class="character-hint">${char.hint}</div>
      <div class="xp-bar-wrap" style="margin-top:14px;">
        <div class="xp-bar-label" style="color:#2e7d32;">
          <span>Lv ${lv.level}</span>
          <span>${lv.current}/${lv.need} XP</span>
        </div>
        <div class="xp-bar" style="background:rgba(46,125,50,0.2);"><div class="xp-bar-fill" style="background:#2e7d32;width:${lv.progress*100}%"></div></div>
      </div>
    </div>
  `;

  // Overall stats
  const totalHabitsDone = state.microHabits.reduce((a,h) => a + h.history.length, 0);
  const totalPracticeMin = state.practiceSessions.reduce((a,p) => a + p.duration, 0);
  const totalBreakthroughs = state.practiceSessions.filter(p => p.breakthrough).length;
  const bestStreak = state.microHabits.reduce((a,h) => Math.max(a, h.bestStreak || 0), 0);
  const totalSubSkills = state.skills.reduce((a,sk) => a + sk.subSkills.length, 0);

  html += `
    <div class="card">
      <div class="card-title">📊 总览</div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-val">${totalHabitsDone}</div>
          <div class="stat-label">习惯完成</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${Math.floor(totalPracticeMin/60)}h</div>
          <div class="stat-label">练习时长</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${bestStreak}</div>
          <div class="stat-label">最长连续</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-val">${state.practiceSessions.length}</div>
          <div class="stat-label">练习次数</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${totalBreakthroughs}</div>
          <div class="stat-label">突破次数</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${totalSubSkills}</div>
          <div class="stat-label">子技能数</div>
        </div>
      </div>
    </div>
  `;

  // Achievements
  html += `<div class="section-label">🏆 成就 (${state.achievements.length}/${ACHIEVEMENT_DEFS.length})</div>`;
  html += `<div class="achievement-grid">`;
  for (const def of ACHIEVEMENT_DEFS) {
    const unlocked = state.achievements.find(a => a.id === def.id);
    html += `
      <div class="achievement ${unlocked ? 'unlocked' : ''}">
        <div class="ach-icon">${unlocked ? def.icon : '🔒'}</div>
        <div class="ach-name">${def.name}</div>
        <div class="ach-desc">${def.desc}</div>
      </div>
    `;
  }
  html += `</div>`;

  // Character evolution
  html += `
    <div class="section-label">🌱 成长之路</div>
    <div class="card">
      ${CHARACTER_STAGES.map((s, i) => {
        const unlocked = lv.level >= s.minLevel;
        const next = i < CHARACTER_STAGES.length - 1 ? CHARACTER_STAGES[i+1] : null;
        return `
          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;${i > 0 ? 'border-top:1px solid #f0f0f0;' : ''}">
            <div style="font-size:32px;${unlocked ? '' : 'filter:grayscale(1);opacity:0.3;'}">${s.emoji}</div>
            <div style="flex:1;">
              <div style="font-weight:700;font-size:14px;${unlocked ? '' : 'color:var(--text-muted);'}">${s.name} ${unlocked ? '✓' : ''}</div>
              <div style="font-size:12px;color:var(--text-muted);">${s.hint}</div>
              ${next && !unlocked ? `<div style="font-size:11px;color:var(--primary);margin-top:2px;">Lv${s.minLevel}解锁</div>` : ''}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  // Reset button
  html += `
    <div style="text-align:center;margin:20px 0;">
      <button class="btn btn-outline btn-sm" onclick="confirmReset()" style="color:var(--danger);border-color:var(--danger);">重置所有数据</button>
    </div>
  `;

  return html;
}

function confirmReset() {
  openModal(`
    <div class="modal-title">⚠️ 确认重置</div>
    <p style="text-align:center;font-size:14px;color:var(--text-light);margin-bottom:20px;">
      这将删除所有习惯、技能、练习记录和成就。<br>此操作不可撤销。
    </p>
    <div style="display:flex;gap:12px;">
      <button class="btn btn-outline btn-block" onclick="closeModal()">取消</button>
      <button class="btn btn-danger btn-block" onclick="resetAll()">确认重置</button>
    </div>
  `);
}

function resetAll() {
  state = {
    user: { name: '探索者', level: 1, totalXP: 0, joinDate: todayStr() },
    microHabits: [],
    skills: [],
    practiceSessions: [],
    achievements: [],
    currentView: 'growth'
  };
  saveState();
  closeModal();
  showToast('已重置，重新开始吧', '🌱');
  navigate('home');
}

// ========== Init ==========
loadState();
navigate('home');

// Check achievements on load
checkAchievements();

// ========== PWA: Register Service Worker ==========
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').then(function(reg) {
      console.log('SW registered:', reg.scope);
    }).catch(function(err) {
      console.log('SW registration failed:', err);
    });
  });
}

// ========== PWA: Handle install prompt ==========
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  // Show install button or banner
  showInstallPrompt();
});

function showInstallPrompt() {
  if (!deferredPrompt) return;
  showToast('点击安装到桌面，离线使用', '📲');
  // Add a small delay then show install
  setTimeout(function() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choice) {
        if (choice.outcome === 'accepted') {
          showToast('安装成功！', '🎉');
        }
        deferredPrompt = null;
      });
    }
  }, 2000);
}
</script>
